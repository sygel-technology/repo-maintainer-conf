
name: Update repos

on:
  push:
    branches:
      - "sygel-repo-maintainer-conf"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v2
        with:
          python-version: "3.10"

      - name: Install requirements
        run: pip install https://github.com/OCA/repo-maintainer/archive/master.zip

      - name: Configure Git
        run: |
          git config --global user.name "Sygel-bot"
          git config --global user.email "sy-bot@sygel.es"

      - name: Manage repositories
        env:
          GH_TOKEN: ${{ secrets.ORG_TOKEN }}
        run: |
          gh auth setup-git --hostname github.com --force
          oca-repo-manage \
            --org "$GITHUB_REPOSITORY_OWNER" \
            --token "$GH_TOKEN" \
            --conf-dir ./conf
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update checksum
          file_pattern: "conf/checksum.yml"
          commit_user_name: Sygel-bot
          commit_user_email: sy-bot@sygel.es
          commit_author: Sygel-bot <sy-bot@sygel.es>
