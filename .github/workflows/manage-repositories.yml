name: Sygel - gestionar repositorios (piloto)

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: "Escribe APLICAR_SYGEL_PILOTO para autorizar este mantenimiento"
        required: true
        type: string

permissions:
  contents: read

jobs:
  gestionar:
    if: ${{ github.repository_owner == 'sygel-technology' && inputs.confirmacion == 'APLICAR_SYGEL_PILOTO' }}
    runs-on: ubuntu-latest
    environment: repo-maintainer-production
    steps:
      - uses: actions/checkout@v6
      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML
          python -m pip install 'git+https://github.com/OCA/repo-maintainer.git'
      - name: Bloquear configuraciones incompletas
        run: python scripts/validate_conf.py
      - name: Sincronizar SOLO el piloto
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_TOKEN }}
        run: |
          test -n "$GITHUB_TOKEN" || { echo "Falta ORG_TOKEN" >&2; exit 1; }
          oca-repo-manage --org sygel-technology --conf-dir ./conf
